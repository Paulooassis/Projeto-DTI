# application.properties
spring.application.name=mini-ecommerce
server.port=8080

# TODO: CODE REVIEW - Configuração de CORS hardcoded
# Sugestão: Adicionar configurações de CORS aqui ao invés de hardcoded no código
# Benefício: Facilita configuração por ambiente, melhora flexibilidade
# cors.allowed.origins=http://127.0.0.1:5500,http://localhost:5500

# Configura��o do banco SQLite
spring.datasource.url=jdbc:sqlite:ecommerce.db
spring.datasource.driver-class-name=org.sqlite.JDBC
spring.datasource.username=sa
spring.datasource.password=

# Configura��o do JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.community.dialect.SQLiteDialect

# Desabilitar seguran�a
spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.security.servlet.SecurityAutoConfiguration